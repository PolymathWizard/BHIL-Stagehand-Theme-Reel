site_name: Stagehand Theme Codex
site_description: Twenty motion themes for page, reel and deck agents, with a self-contained reel that demonstrates every theme at three intensity levels.
site_author: Barry Hurd · Barry Hurd Intelligence Lab
site_url: https://polymathwizard.github.io/BHIL-Stagehand-Theme-Reel/
repo_url: https://github.com/PolymathWizard/BHIL-Stagehand-Theme-Reel
repo_name: PolymathWizard/BHIL-Stagehand-Theme-Reel
edit_uri: ""
copyright: Code MIT · Content CC BY 4.0 · Barry Hurd Intelligence Lab
docs_dir: docs
theme:
  name: material
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.highlight
extra_css:
  - stylesheets/bhil.css
markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Codex:
      - How agents use the codex: codex/how-agents-use.md
      - The Homage Rule: codex/homage-rule.md
